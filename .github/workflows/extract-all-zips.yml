
name: Extract ZIPs and Push Files

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/extract-zips-and-push.yml'

permissions:
  contents: write

concurrency:
  group: extract-zips-and-push
  cancel-in-progress: false

jobs:
  extract-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract all root ZIP files
        shell: bash
        run: |
          set -euo pipefail

          found=0
          mkdir -p extracted

          for archive in ./*.zip; do
            [ -f "$archive" ] || continue
            found=1

            name="$(basename "$archive" .zip)"
            destination="extracted/$name"

            echo "Extracting: $archive"
            mkdir -p "$destination"
            unzip -o "$archive" -d "$destination"
          done

          if [ "$found" -eq 0 ]; then
            echo "No ZIP files found in repository root."
            exit 1
          fi

      - name: Commit and push extracted files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f extracted/

          if git diff --cached --quiet; then
            echo "No new extracted changes to commit."
            exit 0
          fi

          git commit -m "Extract repository ZIP archives"
          git push origin HEAD:main
          
