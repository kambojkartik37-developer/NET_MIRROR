name: Extract ZIP Archives

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'

permissions:
  contents: write

concurrency:
  group: extract-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Extract ZIP archives to repo root
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          archives=( *.zip )

          if [ "${#archives[@]}" -eq 0 ]; then
            echo "Root me koi .zip nahi mili, kuch extract nahi karna."
            exit 0
          fi

          failures=0

          for archive in "${archives[@]}"; do
            name="${archive%.zip}"

            if [[ "$name" == ".git" || "$name" == ".github" || -z "$name" ]]; then
              echo "::warning::'$archive' skip - unsafe folder name."
              continue
            fi

            echo "::group::$archive"
            if ! unzip -tq "$archive"; then
              echo "::error::'$archive' corrupt hai, skip."
              failures=$((failures+1))
              echo "::endgroup::"
              continue
            fi

            mkdir -p "$name"
            unzip -oq "$archive" -d "$name"
            echo "Extracted -> ./$name"
            echo "::endgroup::"
          done

          echo "FAILURES=$failures" >> "$GITHUB_ENV"

      - name: Commit extracted files
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . ':!*.zip'

          if git diff --cached --quiet; then
            echo "Commit ke liye kuch nahi hai."
            exit 0
          fi

          git commit -m "Extract ZIP archives to repo root"

          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "Push attempt $i fail hua, retry kar rahe hain..."
            sleep 5
          done
