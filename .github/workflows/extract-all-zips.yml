name: Extract All ZIPs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/extract-all-zips.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP files
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          found=0
          for file in ./*.zip; do
            [ -f "$file" ] || continue
            found=1
            name="${file##*/}"
            name="${name%.*}"
            mkdir -p "extracted/$name"
            unzip -o "$file" -d "extracted/$name"
          done
          if [ "$found" -eq 0 ]; then
            echo "No ZIP files found in repository root."
            exit 1
          fi

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: NetMirror-Extracted-All-ZIPs
          path: extracted/
          if-no-files-found: error
          retention-days: 7
