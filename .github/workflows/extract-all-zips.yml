name: Extract All ZIPs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/extract-all-zips.yml"

permissions:
  contents: read

jobs:
  extract-zips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract all ZIP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          found=0

          while IFS= read -r -d '' zipfile; do
            found=1
            folder="extracted/$(basename "${zipfile%.zip}")"
            mkdir -p "$folder"
            echo "Extracting: $zipfile"
            unzip -o "$zipfile" -d "$folder"
          done < <(find . -maxdepth 1 -type f -iname '*.zip' -print0)

          if [ "$found" -eq 0 ]; then
            echo "No ZIP files found in the repository root."
            exit 1
          fi

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: NetMirror-Extracted-All-ZIPs
          path: extracted/
          if-no-files-found: error
          retention-days: 7

5. **Commit changes** dabao aur branch `main` select rakho.
6. Ab **Actions → Extract All ZIPs → Run workflow → Run workflow** karo.

### 📦 Result kya milega?

Workflow successful hone par Actions ke run page par `NetMirror-Extracted-All-ZIPs` naam ka artifact milega, jise download kar sakte ho.

**Dhyan do:** Ye workflow repo ke root mein maujood ZIP files extract karega. Screenshot mein dikh rahi YAML error ko is code se theek karna chahiye. Agar phir bhi red ❌ aaye, naya screenshot bhejna.
