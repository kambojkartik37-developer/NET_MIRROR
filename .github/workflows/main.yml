name: Build NetMirror APK from Smali ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip zip
          mkdir -p output

      - name: Find and extract Smali ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname 'NetMirror-smali.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::NetMirror-smali.zip was not found in the repository."
            echo "Upload NetMirror-smali.zip to the repository root."
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          echo "Extracted file overview:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate decoded Android project
        shell: bash
        run: |
          set -euo pipefail

          APKTOOL_FILE="$(find extracted -type f -name apktool.yml -print -quit)"

          if [ -z "$APKTOOL_FILE" ]; then
            echo "::error::apktool.yml not found."
            echo "This ZIP may not contain a complete apktool-decoded APK."
            echo "Required files usually include apktool.yml, AndroidManifest.xml, res/ and smali/."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$APKTOOL_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected project: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml is missing."
            exit 1
          fi

      - name: Rebuild APK
        run: |
          set -euo pipefail
          apktool b "$PROJECT_DIR" \
            --force-all \
            -o "$GITHUB_WORKSPACE/output/NetMirror-unsigned.apk"

          test -s output/NetMirror-unsigned.apk
          echo "APK rebuild completed."

      - name: Create temporary signing key
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/netmirror-release.jks" \
            -storepass android \
            -keypass android \
            -alias netmirror \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NetMirror, OU=Build, O=Local, L=Unknown, ST=Unknown, C=IN"

      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"

          if [ -z "$BUILD_TOOLS" ]; then
            echo "::error::Android SDK build-tools were not found."
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            output/NetMirror-unsigned.apk \
            output/NetMirror-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/netmirror-release.jks" \
            --ks-key-alias netmirror \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out output/NetMirror.apk \
            output/NetMirror-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose output/NetMirror.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NetMirror-APK
          path: output/NetMirror.apk
          if-no-files-found: error
          retention-days: 7
