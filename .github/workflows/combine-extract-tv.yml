name: Combine and Extract NetMirror TV ZIP Parts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combine-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify both ZIP parts exist
        shell: bash
        run: |
          set -euo pipefail
          test -s "NetMirrorTV-decompiled.zip.part1"
          test -s "NetMirrorTV-decompiled.zip.part2"
          ls -lh NetMirrorTV-decompiled.zip.part1 NetMirrorTV-decompiled.zip.part2

      - name: Combine parts into one ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat NetMirrorTV-decompiled.zip.part1 NetMirrorTV-decompiled.zip.part2 > "netmirror android tv.zip"
          unzip -t "netmirror android tv.zip"

      - name: Extract combined ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q "netmirror android tv.zip" -d extracted
          test -n "$(find extracted -type f -print -quit)"
          echo "Extracted file count: $(find extracted -type f | wc -l)"
          find extracted -maxdepth 3 -type f \( -name AndroidManifest.xml -o -name apktool.yml \) -print

      - name: Upload combined ZIP and extracted project
        uses: actions/upload-artifact@v4
        with:
          name: netmirror-android-tv-source
          path: |
            netmirror android tv.zip
            extracted/
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
