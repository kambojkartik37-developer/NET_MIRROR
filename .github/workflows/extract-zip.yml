name: Extract ZIP Archives

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'

permissions:
  contents: write

concurrency:
  group: extract-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Ensure unzip is available
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y unzip
          fi

      - name: Extract ZIP archives to repo root
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          archives=( *.zip )

          if [ "${#archives[@]}" -eq 0 ]; then
            echo "Root me koi .zip file nahi mili. Kuch extract nahi karna."
            exit 0
          fi

          failures=0

          for archive in "${archives[@]}"; do
            name="${archive%.zip}"

            # Repo ke protected folders ko overwrite hone se bachao
            if [[ "$name" == ".git" || "$name" == ".github" || -z "$name" ]]; then
              echo "::warning::'$archive' skip kiya - unsafe target folder name."
              continue
            fi

            echo "::group::$archive"
            echo "Integrity check chal raha hai..."
            if ! unzip -tq "$archive"; then
              echo "::error::'$archive' corrupt/invalid hai, skip kar rahe hain."
              failures=$((failures+1))
              echo "::endgroup::"
              continue
            fi

            echo "Extract ho raha hai -> ./$name"
            mkdir -p "$name"
            unzip -oq "$archive" -d "$name"
            echo "::endgroup::"
          done

          if [ "$failures" -gt 0 ]; then
            echo "::warning::$failures archive(s) extract nahi ho paayi (corrupt). Baaki ka kaam jaari hai."
          fi

      - name: Commit extracted files
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Zip files chhodkar baaki sab (extracted content) stage karo
          git add -A -- . ':!*.zip'

          if git diff --cached --quiet; then
            echo "Commit ke liye kuch naya nahi hai."
            exit 0
          fi

          git commit -m "Extract ZIP archives to repo root [skip ci]"
          git push origin HEAD:main
          
